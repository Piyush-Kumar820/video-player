<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons"
      rel="stylesheet">
</head>
<body>
    <div class="bg">
        <div id="videoPlayer">
            <video src="" id="main-video" controls></video>
            <div class="progressAreaTime"></div>
            <div class="controls">
                <div class="progressArea">
                    <div class="progress-bar">
                        <span></span>
                    </div>
                </div>
                <div class="controls-left">
                    <span class="icon">
                        <i class="material-icons fast-rewind">replay_10</i>
                    </span>
                    <span class="icon">
                        <i class="material-icons play">play_arrow</i>
                    </span>
                    <span class="icon">
                        <i class="material-icons fast-forward">forward_10</i>
                    </span>
                    <span class="icon">
                        <i class="material-icons volume">volume_up</i>
                        <input type="range" id="volume" min="0" max="1" step="0.1" id="volume_range">
                    </span>
                    <div class="timer">
                        <span class="current">0:00</span>/<span class="duration">0:00</span>
                    </div>
                </div>
                <div class="controls-right">
                    <span class="icon">
                        <i class="material-icons auto-play"></i>
                    </span>
                    <span class="icon">
                        <i class="material-icons subtitlesBtn">subtitles</i>
                    </span>
                    <span class="icon">
                        <i class="material-icons settingsBtn">settings</i>
                    </span>
                    <span class="icon">
                        <i class="material-icons fullscreenBtn">fullscreen</i>
                    </span>
                </div>
            </div>
            <div class="settings">
            <div class="playback">
                <span>Playback Speed</span>
                <ul>
                    <li data-speed="0.5">0.5x</li>
                    <li data-speed="0.75">0.75x</li>
                    <li data-speed="1">Normal</li>
                    <li data-speed="1.25">1.25x</li>
                    <li data-speed="1.5">1.5x</li>
                    <li data-speed="2">2x</li>
                </ul>
            </div>
        </div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
